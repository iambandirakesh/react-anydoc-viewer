name: Feature request
description: Suggest a format feature, an API or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The behaviour, prop or API you have in mind.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, examples from other tools, screenshots.
